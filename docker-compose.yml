services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insurance_claims
      POSTGRES_USER: ${POSTGRES_USER:-claims_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims_app_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/insurance_claims
      DB_USERNAME: ${POSTGRES_USER:-claims_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-claims_app_dev_password}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
